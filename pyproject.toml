[project]
name = "etch"
version = "0.1.0"
description = "Diagram generation for codebases using Nano Banana Pro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
etch = "etch:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["etch"]
